<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>Werk Betch</title>
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; background: #0A0A0A; -webkit-text-size-adjust: 100%; }
      * { box-sizing: border-box; }
      button, label, [role="button"] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
      /* Exact visible height on phones (100vh includes the area behind the browser bar). */
      .app-shell { height: 100vh; height: 100dvh; overflow: hidden; }
      /* iOS zooms the page when focusing any field under 16px. */
      @media (hover: none) and (pointer: coarse) {
        input, textarea, select { font-size: 16px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
